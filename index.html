<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAG Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f6f7fb; --surface: #ffffff; --surface-2: #f0f2f8; --border: #e2e5ef;
  --text: #121527; --muted: #5d6481; --accent: #5b4bff; --accent-2: #00b8a9;
  --accent-soft: rgba(91,75,255,.10); --warn: #e8590c; --ok: #12a150;
  --shadow: 0 1px 2px rgba(16,20,40,.04), 0 8px 24px rgba(16,20,40,.06);
  --r: 14px; --mono: "JetBrains Mono", ui-monospace, monospace; --sans: "Inter", system-ui, sans-serif;
  --d1: #5b4bff; --d2: #00b8a9; --d3: #f59f00; --d4: #e64980; --d5: #228be6; --d6: #82c91e;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0d17; --surface: #131627; --surface-2: #1a1e33; --border: #262b45;
    --text: #e9ebf5; --muted: #8e94b3; --accent: #8577ff; --accent-2: #2fd9c9;
    --accent-soft: rgba(133,119,255,.14); --shadow: 0 8px 30px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"] {
  --bg: #0b0d17; --surface: #131627; --surface-2: #1a1e33; --border: #262b45;
  --text: #e9ebf5; --muted: #8e94b3; --accent: #8577ff; --accent-2: #2fd9c9;
  --accent-soft: rgba(133,119,255,.14); --shadow: 0 8px 30px rgba(0,0,0,.35);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--sans); background: var(--bg); color: var(--text); line-height: 1.55; font-size: 15px; }
button, input, textarea, select { font: inherit; color: inherit; }

/* ---------- header ---------- */
header {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 14px 24px; border-bottom: 1px solid var(--border); background: var(--surface);
  position: sticky; top: 0; z-index: 20;
}
.logo { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: -.01em; }
.logo .mark {
  width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; color: #fff; font-size: 14px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
}
.logo small { font-weight: 500; color: var(--muted); font-size: 13px; }
.hdr-actions { display: flex; gap: 8px; }
.btn {
  border: 1px solid var(--border); background: var(--surface); padding: 8px 14px; border-radius: 10px;
  cursor: pointer; font-size: 13.5px; font-weight: 500; transition: border-color .15s, background .15s;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.08); }
.btn:disabled { opacity: .45; cursor: not-allowed; }

/* ---------- layout ---------- */
.app { display: grid; grid-template-columns: 270px 1fr; min-height: calc(100vh - 59px); }
aside { border-right: 1px solid var(--border); background: var(--surface); padding: 20px 14px; }
.phase { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 14px 10px 8px; }
.phase:first-child { margin-top: 0; }
.step-btn {
  width: 100%; display: flex; gap: 12px; align-items: center; text-align: left;
  border: 0; background: transparent; padding: 9px 10px; border-radius: 10px; cursor: pointer; position: relative;
}
.step-btn:hover { background: var(--surface-2); }
.step-btn .num {
  width: 26px; height: 26px; border-radius: 50%; flex: none; display: grid; place-items: center;
  font-family: var(--mono); font-size: 12px; border: 1.5px solid var(--border); color: var(--muted); background: var(--surface);
}
.step-btn.done .num { border-color: var(--accent-2); color: var(--accent-2); }
.step-btn.active { background: var(--accent-soft); }
.step-btn.active .num { background: var(--accent); border-color: var(--accent); color: #fff; }
.step-btn .t { font-size: 14px; font-weight: 500; }
.step-btn .s { font-size: 12px; color: var(--muted); display: block; }
.pulse { animation: pulse .7s ease; }
@keyframes pulse { 50% { transform: scale(1.18); } }

main { padding: 28px clamp(16px, 3vw, 40px) 60px; max-width: 1180px; width: 100%; }
.step-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
.eyebrow { font-family: var(--mono); font-size: 12px; color: var(--accent); letter-spacing: .1em; text-transform: uppercase; }
h1 { font-size: clamp(24px, 3vw, 32px); letter-spacing: -.02em; margin: 4px 0 6px; }
.lede { color: var(--muted); max-width: 680px; }
.nav-btns { display: flex; gap: 8px; }

.grid { display: grid; grid-template-columns: 1.35fr 1fr; gap: 18px; align-items: start; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); box-shadow: var(--shadow); padding: 20px; }
.card h3 { font-size: 14px; font-weight: 600; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.card h3 .hint { font-weight: 400; color: var(--muted); font-size: 12.5px; }
.stack > * + * { margin-top: 18px; }
.explain p + p { margin-top: 10px; }
.explain p { color: var(--muted); font-size: 14px; }
.explain b { color: var(--text); font-weight: 600; }
.callout {
  border-left: 3px solid var(--warn); background: color-mix(in srgb, var(--warn) 8%, transparent);
  padding: 10px 14px; border-radius: 0 10px 10px 0; font-size: 13.5px; margin-top: 14px;
}
.callout b { color: var(--warn); }
.real {
  border-left: 3px solid var(--accent-2); background: color-mix(in srgb, var(--accent-2) 8%, transparent);
  padding: 10px 14px; border-radius: 0 10px 10px 0; font-size: 13.5px; margin-top: 14px;
}
.real b { color: var(--accent-2); }

/* ---------- controls ---------- */
textarea, input[type=text] {
  width: 100%; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px;
  padding: 12px; font-family: var(--mono); font-size: 13px; resize: vertical; outline: none;
}
textarea:focus, input[type=text]:focus { border-color: var(--accent); }
.ctrl { display: grid; grid-template-columns: 130px 1fr 54px; gap: 12px; align-items: center; margin-bottom: 12px; font-size: 13.5px; }
.ctrl output { font-family: var(--mono); text-align: right; color: var(--accent); }
input[type=range] { accent-color: var(--accent); width: 100%; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.chip {
  border: 1px solid var(--border); background: var(--surface-2); border-radius: 999px; padding: 5px 12px;
  font-size: 12.5px; cursor: pointer;
}
.chip:hover { border-color: var(--accent); color: var(--accent); }

/* ---------- step visuals ---------- */
.doc-list { display: grid; gap: 10px; }
.doc { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; background: var(--surface-2); }
.doc .title { font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
.doc .meta { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }

.chunks { display: grid; gap: 10px; max-height: 560px; overflow: auto; padding-right: 4px; }
.chunk {
  border: 1px solid var(--border); border-left: 4px solid var(--c); border-radius: 10px; padding: 10px 12px; background: var(--surface-2);
  font-size: 13.5px;
}
.chunk .head { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 11.5px; color: var(--muted); margin-bottom: 4px; }
.chunk .ov { background: color-mix(in srgb, var(--warn) 22%, transparent); border-radius: 3px; }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
.stat { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
.stat b { display: block; font-size: 20px; letter-spacing: -.02em; }
.stat span { font-size: 12px; color: var(--muted); }

.pipe { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-family: var(--mono); font-size: 12px; margin-bottom: 14px; }
.pipe .tok { padding: 4px 8px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--border); }
.pipe .tok.syn { border-color: var(--accent-2); color: var(--accent-2); }
.pipe .tok.stop { text-decoration: line-through; opacity: .45; }
.pipe .arrow { color: var(--muted); }

.heat { display: grid; gap: 3px; }
.heat-row { display: grid; grid-template-columns: 44px 1fr; gap: 8px; align-items: center; font-family: var(--mono); font-size: 11px; color: var(--muted); }
.cells { display: grid; grid-template-columns: repeat(128, 1fr); gap: 1px; }
.cells i { height: 14px; min-width: 0; border-radius: 2px; background: var(--accent); }
.heat-row.q .cells i { background: var(--warn); }
.vec { font-family: var(--mono); font-size: 11.5px; color: var(--muted); word-break: break-all; background: var(--surface-2); padding: 10px; border-radius: 10px; margin-top: 12px; }

canvas { width: 100%; display: block; border-radius: 10px; background: var(--surface-2); }
.legend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 10px; font-size: 12.5px; color: var(--muted); }
.legend span { display: flex; align-items: center; gap: 6px; }

.results { display: grid; gap: 10px; }
.res { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; background: var(--surface-2); transition: opacity .2s; }
.res.out { opacity: .45; }
.res .top { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 12.5px; margin-bottom: 6px; }
.res .rank { font-family: var(--mono); font-weight: 500; }
.badge { font-family: var(--mono); font-size: 11px; padding: 2px 8px; border-radius: 999px; }
.badge.in { background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); }
.badge.outb { background: var(--border); color: var(--muted); }
.scorebar { height: 6px; border-radius: 6px; background: var(--border); overflow: hidden; margin-bottom: 8px; }
.scorebar i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .6s cubic-bezier(.2,.8,.2,1); }
.res p { font-size: 13px; }
.res mark { background: color-mix(in srgb, var(--accent-2) 25%, transparent); color: inherit; border-radius: 3px; padding: 0 1px; }

.prompt { font-family: var(--mono); font-size: 12.5px; white-space: pre-wrap; background: var(--surface-2); border-radius: 10px; padding: 14px; max-height: 520px; overflow: auto; line-height: 1.6; }
.prompt .sys { color: var(--accent); }
.prompt .ctx { color: var(--accent-2); }
.prompt .q { color: var(--warn); }
.tokcount { font-family: var(--mono); font-size: 12px; color: var(--muted); }

.answer { font-size: 15px; min-height: 80px; }
.answer sup { color: var(--accent); font-family: var(--mono); font-weight: 600; font-size: 11px; }
.caret { display: inline-block; width: 8px; height: 16px; background: var(--accent); vertical-align: -2px; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.compare { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.compare .col { background: var(--surface-2); border-radius: 10px; padding: 14px; font-size: 14px; }
.compare .col h4 { font-size: 12px; font-family: var(--mono); letter-spacing: .08em; text-transform: uppercase; margin-bottom: 8px; color: var(--muted); }
.sources { margin-top: 14px; display: grid; gap: 6px; font-size: 12.5px; color: var(--muted); }

.flow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 18px; }
.flow span { font-family: var(--mono); font-size: 11.5px; padding: 4px 9px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
.flow span.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.flow em { color: var(--muted); font-style: normal; font-size: 11px; }

.hidden { display: none !important; }
.fade { animation: fade .35s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

@media (max-width: 960px) {
  .app { grid-template-columns: 1fr; }
  aside { border-right: 0; border-bottom: 1px solid var(--border); display: flex; overflow-x: auto; gap: 4px; padding: 10px; }
  .phase { display: none; }
  .step-btn { width: auto; flex: none; }
  .step-btn .s { display: none; }
  .grid, .compare { grid-template-columns: 1fr; }
  .logo small { display: none; }
}
@media (max-width: 520px) { .ctrl { grid-template-columns: 1fr 54px; } .ctrl label { grid-column: 1 / -1; } .hdr-actions .btn:not(.primary) { display: none; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<header>
  <div class="logo"><div class="mark">◆</div>RAG Simulator <small>Retrieval-Augmented Generation, step by step</small></div>
  <div class="hdr-actions">
    <button class="btn" id="themeBtn">◐ Theme</button>
    <button class="btn primary" id="autoBtn">▶ Run full pipeline</button>
  </div>
</header>

<div class="app">
  <aside id="sidebar"></aside>
  <main>
    <div class="flow" id="flow"></div>
    <div class="step-head">
      <div>
        <div class="eyebrow" id="eyebrow"></div>
        <h1 id="title"></h1>
        <p class="lede" id="lede"></p>
      </div>
      <div class="nav-btns">
        <button class="btn" id="prevBtn">← Back</button>
        <button class="btn primary" id="nextBtn">Next →</button>
      </div>
    </div>
    <div id="stage"></div>
  </main>
</div>

<script>
/* =====================================================================
   SAMPLE KNOWLEDGE BASE (fictional company — edit freely in step 1)
   ===================================================================== */
const SAMPLE_DOCS = `# Payout rails
Nordwind Pay supports three payout rails. SEPA Instant transfers settle in under 10 seconds and are available 24/7 for euro payouts. The fee for a SEPA Instant payout is 0.20 EUR per transfer. Standard SEPA transfers settle on the next business day and cost 0.05 EUR. For countries outside the euro area we use SWIFT. SWIFT payouts take one to three business days and cost 15 EUR, plus any intermediary bank charges.

# Refund policy
Customers can request a refund within 30 days of a payment. Refunds are returned to the original payment method. Card refunds usually arrive within 5 to 10 business days, while bank transfer refunds arrive within 2 business days. Subscription fees are not refundable after the billing period has started.

# Security and compliance
Every account must complete identity verification before its first payout. Verification requires a valid passport or national ID and a proof of address. Our anti-money laundering screening flags large transfers above 10,000 EUR for manual review. A manual review is usually completed within one business day. Accounts that fail screening are frozen until the compliance team finishes its investigation.

# Customer support
Our support team is available Monday to Friday from 8:00 to 18:00 CET by email and phone. Premium customers get 24/7 live chat support. The average first response time by email is four hours. Urgent payout problems can be escalated through the dashboard.`;

const SAMPLE_QUERIES = [
  'How much does an instant payout cost?',
  'How fast are SWIFT transfers?',
  'When is a large transfer reviewed?',
  'Can I get my money back?',
  'What is the CEO\'s name?'
];

/* =====================================================================
   NLP + EMBEDDING ENGINE (toy, but genuinely computed)
   ===================================================================== */
const DIMS = 128;
const STOP = new Set('a an the and or of to in on for is are be by with from at as it its this that our we you your can get do does how what when which who per any any plus than until into until their there usually must after before not under over will i my me much'.split(' '));
// Real embedding models *learn* that these words mean similar things. We hard-code it to show the idea.
const SYN = {
  cost:'fee', price:'fee', charge:'fee', fee:'fee',
  fast:'speed', quick:'speed', speed:'speed', long:'speed', settle:'speed', arrive:'speed', take:'speed',
  refund:'refund', reimburse:'refund', return:'refund',
  large:'large', big:'large', high:'large',
  payout:'payout', transfer:'payout', payment:'payout',
  verification:'verify', verify:'verify', identity:'verify', kyc:'verify',
  support:'support', help:'support', contact:'support',
  instant:'instant', immediate:'instant'
};
function stem(w) {
  if (w.length > 5 && w.endsWith('ing')) return w.slice(0, -3);
  if (w.length > 4 && w.endsWith('ed')) return w.slice(0, -2);
  if (w.length > 3 && w.endsWith('s') && !w.endsWith('ss')) return w.slice(0, -1);
  return w;
}
// Returns detailed trace so the UI can show every transformation.
function analyse(text) {
  const raw = (text.toLowerCase().replace(/money back/g, 'refund').replace(/['’]s\b/g, '').match(/[a-z0-9]+(?:[.,][0-9]+)?/g) || []).filter(w => w.length > 1);
  return raw.map(w => {
    if (STOP.has(w)) return { w, out: null, stop: true };
    const s = stem(w); const c = SYN[s] || SYN[w] || s;
    return { w, out: c, syn: c !== s };
  });
}
const tokens = t => analyse(t).filter(x => x.out).map(x => x.out);
function hash(s) { let h = 5381; for (const ch of s) h = ((h << 5) + h + ch.charCodeAt(0)) >>> 0; return h % DIMS; }

function buildIndex(chunks) {
  const df = {};
  chunks.forEach(c => { c.toks = tokens(c.text); new Set(c.toks).forEach(t => df[t] = (df[t] || 0) + 1); });
  const N = chunks.length;
  const idf = t => Math.log((N + 1) / ((df[t] || 0) + 1)) + 1;
  const embed = toks => {
    const v = new Array(DIMS).fill(0), tf = {};
    toks.forEach(t => tf[t] = (tf[t] || 0) + 1);
    for (const t in tf) v[hash(t)] += (tf[t] / toks.length) * idf(t);
    const n = Math.hypot(...v) || 1;
    return v.map(x => x / n);
  };
  chunks.forEach(c => c.vec = embed(c.toks));
  return { embed, idf, df };
}
const cos = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0);
// Show only the slots that hold a value: most of a sparse vector is zeros.
const nz = (v, n) => { const e = v.map((x, i) => [i, x]).filter(([, x]) => x); return { txt: e.slice(0, n).map(([i, x]) => `d${i}: ${x.toFixed(3)}`).join(', '), count: e.length }; };

// 2-D projection via PCA (power iteration) so 128-d vectors can be plotted.
function pca2(vecs) {
  const n = vecs.length, d = vecs[0].length;
  const mean = new Array(d).fill(0);
  vecs.forEach(v => v.forEach((x, i) => mean[i] += x / n));
  const X = vecs.map(v => v.map((x, i) => x - mean[i]));
  const comps = [];
  for (let k = 0; k < 2; k++) {
    let w = Array.from({ length: d }, (_, i) => Math.sin(i * 7.3 + k * 3.1) + 0.5);
    for (let it = 0; it < 80; it++) {
      const s = X.map(r => r.reduce((a, x, i) => a + x * w[i], 0));
      const nw = new Array(d).fill(0);
      X.forEach((r, j) => r.forEach((x, i) => nw[i] += x * s[j]));
      comps.forEach(c => { const p = nw.reduce((a, x, i) => a + x * c[i], 0); c.forEach((x, i) => nw[i] -= p * x); });
      const nn = Math.hypot(...nw) || 1; w = nw.map(x => x / nn);
    }
    comps.push(w);
  }
  return v => comps.map(c => v.reduce((a, x, i) => a + (x - mean[i]) * c[i], 0));
}

/* =====================================================================
   STATE
   ===================================================================== */
const S = {
  docsText: SAMPLE_DOCS, docs: [], chunkSize: 45, overlap: 15, chunks: [], index: null,
  query: SAMPLE_QUERIES[0], qVec: null, qTrace: [], topK: 3, minScore: 0.25, results: [],
  step: 0, visited: new Set([0])
};
const COLORS = ['var(--d1)','var(--d2)','var(--d3)','var(--d4)','var(--d5)','var(--d6)'];
const HEX = () => ['--d1','--d2','--d3','--d4','--d5','--d6'].map(v => getComputedStyle(document.documentElement).getPropertyValue(v).trim());

function parseDocs() {
  S.docs = S.docsText.split(/^# /m).map(s => s.trim()).filter(Boolean).map((block, i) => {
    const [title, ...rest] = block.split('\n');
    return { id: i, title: title.trim(), text: rest.join(' ').replace(/\s+/g, ' ').trim(), color: COLORS[i % COLORS.length] };
  }).filter(d => d.text);
}
function chunkDocs() {
  const stepW = Math.max(1, S.chunkSize - S.overlap);
  S.chunks = [];
  S.docs.forEach(d => {
    const words = d.text.split(' ');
    for (let i = 0; i < words.length; i += stepW) {
      const slice = words.slice(i, i + S.chunkSize);
      S.chunks.push({ id: S.chunks.length, doc: d, text: slice.join(' '), start: i, ovWords: i === 0 ? 0 : Math.min(S.overlap, slice.length) });
      if (i + S.chunkSize >= words.length) break;
    }
  });
}
function runQuery() {
  S.qTrace = analyse(S.query);
  S.qVec = S.index.embed(S.qTrace.filter(x => x.out).map(x => x.out));
  S.results = S.chunks.map(c => ({ c, score: cos(S.qVec, c.vec) })).sort((a, b) => b.score - a.score);
  S.results.forEach((r, i) => r.used = i < S.topK && r.score >= S.minScore);
}
function recompute() { parseDocs(); chunkDocs(); S.index = buildIndex(S.chunks); runQuery(); }

/* =====================================================================
   STEPS
   ===================================================================== */
const STEPS = [
  { phase: 'Indexing (offline)', key: 'load', t: 'Load documents', s: 'Your knowledge source',
    lede: 'RAG starts with the data you want the model to answer from — help-centre articles, contracts, policies, tickets. The model was never trained on it, so we have to fetch it at question time.' },
  { phase: 'Indexing (offline)', key: 'chunk', t: 'Chunk', s: 'Split into passages',
    lede: 'Whole documents are too long and too broad to retrieve precisely, so they are split into small, overlapping chunks. Each chunk becomes one searchable unit.' },
  { phase: 'Indexing (offline)', key: 'embed', t: 'Embed', s: 'Text → vectors',
    lede: 'An embedding model turns each chunk into a list of numbers (a vector) that captures its meaning. Texts about similar things end up with similar vectors.' },
  { phase: 'Indexing (offline)', key: 'store', t: 'Store', s: 'Vector database',
    lede: 'The vectors are saved in a vector store with their original text and metadata. Below, the 128-dimensional vectors are squashed to 2-D so you can see how chunks cluster by topic.' },
  { phase: 'Querying (runtime)', key: 'query', t: 'Embed the query', s: 'Same model, same space',
    lede: 'When a user asks a question, it goes through exactly the same embedding pipeline, so the question lands in the same vector space as the chunks.' },
  { phase: 'Querying (runtime)', key: 'retrieve', t: 'Retrieve', s: 'Similarity search',
    lede: 'The vector store compares the question vector to every chunk vector using cosine similarity and returns the closest top-k chunks above a threshold.' },
  { phase: 'Querying (runtime)', key: 'augment', t: 'Augment', s: 'Build the prompt',
    lede: 'The retrieved chunks are pasted into the prompt as context, along with instructions to answer only from that context and cite sources.' },
  { phase: 'Querying (runtime)', key: 'generate', t: 'Generate', s: 'Grounded answer',
    lede: 'The LLM reads the augmented prompt and writes an answer grounded in the retrieved text, with citations back to the source chunks.' }
];

/* ---------- sidebar + flow ---------- */
const sidebar = document.getElementById('sidebar');
function renderSidebar() {
  let html = '', ph = '';
  STEPS.forEach((st, i) => {
    if (st.phase !== ph) { ph = st.phase; html += `<div class="phase">${ph}</div>`; }
    const cls = i === S.step ? 'active' : (S.visited.has(i) ? 'done' : '');
    html += `<button class="step-btn ${cls}" data-i="${i}"><span class="num">${S.visited.has(i) && i !== S.step ? '✓' : i + 1}</span><span><span class="t">${st.t}</span><span class="s">${st.s}</span></span></button>`;
  });
  sidebar.innerHTML = html;
  sidebar.querySelectorAll('.step-btn').forEach(b => b.onclick = () => go(+b.dataset.i));
  document.getElementById('flow').innerHTML = STEPS.map((st, i) => `<span class="${i <= S.step ? 'on' : ''}">${st.t}</span>${i < STEPS.length - 1 ? '<em>→</em>' : ''}`).join('');
}

/* ---------- helpers ---------- */
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const estTokens = s => Math.ceil(s.length / 4);
function highlight(text) {
  const q = new Set(S.qTrace.filter(x => x.out).map(x => x.out));
  return text.split(/(\s+)/).map(w => {
    const t = tokens(w); return t.length && q.has(t[0]) ? `<mark>${esc(w)}</mark>` : esc(w);
  }).join('');
}
function querySelector() {
  return `<input type="text" id="qInput" value="${esc(S.query)}" placeholder="Ask a question about the documents…">
  <div class="chips">${SAMPLE_QUERIES.map(q => `<button class="chip" data-q="${esc(q)}">${esc(q)}</button>`).join('')}</div>`;
}
function bindQuery(rerender) {
  const inp = document.getElementById('qInput');
  if (!inp) return;
  inp.oninput = () => { S.query = inp.value; runQuery(); rerender(); };
  document.querySelectorAll('.chip[data-q]').forEach(c => c.onclick = () => { S.query = c.dataset.q; inp.value = S.query; runQuery(); rerender(); });
}

/* ---------- step renderers ---------- */
const R = {};

R.load = stage => {

      <div class="chips"><button class="chip" id="resetDocs">↺ Reset sample</button></div>
    </div>

      <div class="card"><h3>Parsed documents</h3><div class="doc-list" id="docList"></div></div>
      <div class="card explain">
        <p>In production this step is <b>ingestion</b>: pulling files from Drive, Confluence, a database or a website, then extracting clean text from PDFs, HTML or Word files.</p>
        <p>Metadata such as title, source URL, date and access rights is kept alongside the text so it can be filtered and cited later.</p>
        <div class="callout"><b>Pitfall:</b> garbage in, garbage out. Bad PDF extraction, duplicated pages or stale documents give wrong answers no matter how good the model is.</div>
      </div>
    </div></div>`;
  const list = () => document.getElementById('docList').innerHTML = S.docs.map(d =>
    `<div class="doc"><div class="title"><span class="dot" style="background:${d.color}"></span>${esc(d.title)}</div>
     <div class="meta">${d.text.split(' ').length} words · ~${estTokens(d.text)} tokens</div></div>`).join('') || '<p class="lede">No documents yet.</p>';
  list();
  const ta = document.getElementById('docsTa');
  ta.oninput = () => { S.docsText = ta.value; recompute(); list(); };
  document.getElementById('resetDocs').onclick = () => { S.docsText = SAMPLE_DOCS; ta.value = SAMPLE_DOCS; recompute(); list(); };
};

R.chunk = stage => {
  stage.innerHTML = `<div class="grid fade">
    <div class="card"><h3>Chunks <span class="hint">Orange = overlap with previous chunk</span></h3><div class="chunks" id="chunkList"></div></div>
    <div class="stack">
      <div class="card"><h3>Chunking settings</h3>
        <div class="ctrl"><label>Chunk size (words)</label><input type="range" id="cs" min="10" max="120" value="${S.chunkSize}"><output id="csO">${S.chunkSize}</output></div>
        <div class="ctrl"><label>Overlap (words)</label><input type="range" id="ov" min="0" max="40" value="${S.overlap}"><output id="ovO">${S.overlap}</output></div>
        <div class="stats" id="cStats"></div>
      </div>
      <div class="card explain">
        <p><b>Small chunks</b> are precise but can lose context (“it costs 0.20 EUR” — what does?). <b>Large chunks</b> keep context but dilute the meaning and waste prompt space.</p>
        <p><b>Overlap</b> repeats a few words between neighbours so a fact cut at a boundary still appears whole in at least one chunk.</p>
        <div class="callout"><b>Try it:</b> set size 40 and overlap 10, then ask “How fast are SWIFT transfers?” in step 8. The key sentence gets cut across two chunks and the answer gets worse.</div>
        <div class="real"><b>In practice:</b> 200–800 tokens with 10–20% overlap is common, often split on headings, paragraphs or sentences rather than a fixed word count.</div>
      </div>
    </div></div>`;
  const draw = () => {
    document.getElementById('chunkList').innerHTML = S.chunks.map(c => {
      const w = c.text.split(' '), ov = w.slice(0, c.ovWords).join(' '), rest = w.slice(c.ovWords).join(' ');
      return `<div class="chunk" style="--c:${c.doc.color}"><div class="head"><span>C${c.id + 1} · ${esc(c.doc.title)}</span><span>${w.length} words</span></div>
      ${ov ? `<span class="ov">${esc(ov)}</span> ` : ''}${esc(rest)}</div>`;
    }).join('');
    const avg = S.chunks.length ? Math.round(S.chunks.reduce((a, c) => a + c.text.split(' ').length, 0) / S.chunks.length) : 0;
    document.getElementById('cStats').innerHTML = `<div class="stat"><b>${S.docs.length}</b><span>documents</span></div><div class="stat"><b>${S.chunks.length}</b><span>chunks</span></div><div class="stat"><b>${avg}</b><span>avg words</span></div>`;
  };
  draw();
  const cs = document.getElementById('cs'), ov = document.getElementById('ov');
  const upd = () => {
    S.chunkSize = +cs.value; S.overlap = Math.min(+ov.value, S.chunkSize - 1); ov.value = S.overlap;
    document.getElementById('csO').textContent = S.chunkSize; document.getElementById('ovO').textContent = S.overlap;
    recompute(); draw();
  };
  cs.oninput = upd; ov.oninput = upd;
};

function tracePipe(trace) {
  return trace.map(x => `<span class="tok ${x.stop ? 'stop' : ''} ${x.syn ? 'syn' : ''}" title="${x.stop ? 'stop word removed' : x.w + ' → ' + x.out}">${x.stop ? esc(x.w) : esc(x.out)}</span>`).join('');
}
function heatRow(label, vec, q) {
  const max = Math.max(...vec.map(Math.abs)) || 1;
  return `<div class="heat-row ${q ? 'q' : ''}"><span>${label}</span><div class="cells">${vec.map(x => `<i style="opacity:${(0.06 + 0.94 * Math.abs(x) / max).toFixed(2)}"></i>`).join('')}</div></div>`;
}

R.embed = stage => {
  const first = S.chunks[0];
  stage.innerHTML = `<div class="grid fade">
    <div class="card"><h3>Embedding matrix <span class="hint">${S.chunks.length} chunks × ${DIMS} dimensions</span></h3>
      <div class="heat">${S.chunks.slice(0, 24).map(c => heatRow('C' + (c.id + 1), c.vec)).join('')}</div>
      ${S.chunks.length > 24 ? `<p class="lede" style="margin-top:8px;font-size:12.5px">Showing 24 of ${S.chunks.length}.</p>` : ''}
    </div>
    <div class="stack">
      <div class="card"><h3>How chunk C1 becomes a vector</h3>
        <p class="lede" style="font-size:13px;margin-bottom:10px">lowercase → drop stop words → stem → map synonyms <span style="color:var(--accent-2)">(teal)</span> → weight (TF-IDF) → hash into ${DIMS} slots → normalise</p>
        <div class="pipe">${first ? tracePipe(analyse(first.text)) : ''}</div>
        <div class="vec">${first ? `{ ${nz(first.vec, 10).txt}, … }<br><br>${nz(first.vec).count} of ${DIMS} slots are non-zero; the rest are 0.` : ''}</div>
      </div>
      <div class="card explain">
        <p>Every chunk is now a point in ${DIMS}-dimensional space. Darker cells are larger values.</p>
        <p>This simulator uses a transparent toy embedding (hashed TF-IDF plus a small synonym list) so you can see each step. It knows “cost” ≈ “fee” only because we told it.</p>
        <div class="real"><b>In practice:</b> a neural embedding model (e.g. from OpenAI, Cohere, Voyage or an open-source model) outputs 384–3,072 dimensions and learns meaning from huge amounts of text, so it understands synonyms and paraphrases on its own.</div>
      </div>
    </div></div>`;
};

function drawMap(canvas, withQuery) {
  const dpr = devicePixelRatio || 1, W = canvas.clientWidth, H = Math.round(W * 0.68);
  canvas.width = W * dpr; canvas.height = H * dpr; canvas.style.height = H + 'px';
  const ctx = canvas.getContext('2d'); ctx.scale(dpr, dpr);
  if (S.chunks.length < 2) return;
  const proj = pca2(S.chunks.map(c => c.vec));
  const pts = S.chunks.map(c => proj(c.vec));
  const qp = withQuery ? proj(S.qVec) : null;
  const all = qp ? pts.concat([qp]) : pts;
  const xs = all.map(p => p[0]), ys = all.map(p => p[1]);
  const [x0, x1, y0, y1] = [Math.min(...xs), Math.max(...xs), Math.min(...ys), Math.max(...ys)];
  const pad = 34, sx = x => pad + (x - x0) / ((x1 - x0) || 1) * (W - 2 * pad), sy = y => pad + (y - y0) / ((y1 - y0) || 1) * (H - 2 * pad);
  const css = getComputedStyle(document.documentElement), hex = HEX();
  ctx.strokeStyle = css.getPropertyValue('--border'); ctx.lineWidth = 1;
  for (let g = 1; g < 6; g++) { ctx.beginPath(); ctx.moveTo(W * g / 6, 0); ctx.lineTo(W * g / 6, H); ctx.moveTo(0, H * g / 6); ctx.lineTo(W, H * g / 6); ctx.stroke(); }
  if (qp) {
    S.results.filter(r => r.used).forEach(r => {
      const p = pts[r.c.id]; ctx.strokeStyle = css.getPropertyValue('--warn'); ctx.setLineDash([4, 4]); ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(sx(qp[0]), sy(qp[1])); ctx.lineTo(sx(p[0]), sy(p[1])); ctx.stroke(); ctx.setLineDash([]);
    });
  }
  ctx.font = '11px JetBrains Mono, monospace';
  pts.forEach((p, i) => {
    const c = S.chunks[i], col = hex[c.doc.id % hex.length];
    const used = qp && S.results.find(r => r.c.id === i).used;
    ctx.fillStyle = col; ctx.globalAlpha = qp && !used ? 0.45 : 1;
    ctx.beginPath(); ctx.arc(sx(p[0]), sy(p[1]), used ? 9 : 7, 0, 7); ctx.fill();
    ctx.fillStyle = css.getPropertyValue('--muted'); ctx.fillText('C' + (i + 1), sx(p[0]) + 10, sy(p[1]) + 4); ctx.globalAlpha = 1;
  });
  if (qp) {
    const x = sx(qp[0]), y = sy(qp[1]); ctx.fillStyle = css.getPropertyValue('--warn');
    ctx.beginPath(); for (let k = 0; k < 10; k++) { const r = k % 2 ? 6 : 13, a = Math.PI / 5 * k - Math.PI / 2; ctx.lineTo(x + r * Math.cos(a), y + r * Math.sin(a)); } ctx.fill();
    ctx.font = '600 12px Inter, sans-serif'; ctx.fillText('your question', x + 15, y - 8);
  }
}
const legend = q => `<div class="legend">${S.docs.map(d => `<span><i class="dot" style="background:${d.color}"></i>${esc(d.title)}</span>`).join('')}${q ? '<span><i class="dot" style="background:var(--warn)"></i>Query</span>' : ''}</div>`;

R.store = stage => {
  stage.innerHTML = `<div class="grid fade">
    <div class="card"><h3>Vector space (2-D projection) <span class="hint">Closer = more similar</span></h3><canvas id="map"></canvas>${legend(false)}</div>
    <div class="stack">
      <div class="card"><h3>What a stored record looks like</h3>
        <div class="vec" style="margin-top:0">{<br>&nbsp; id: "C1",<br>&nbsp; vector: { ${S.chunks[0] ? nz(S.chunks[0].vec, 3).txt : ''}, … },<br>&nbsp; text: "${S.chunks[0] ? esc(S.chunks[0].text.slice(0, 60)) : ''}…",<br>&nbsp; metadata: { source: "${S.chunks[0] ? esc(S.chunks[0].doc.title) : ''}" }<br>}</div>
      </div>
      <div class="card explain">
        <p>Notice that chunks from the same document tend to sit together — the vectors captured their topic.</p>
        <p>Indexing is done <b>once, ahead of time</b>, and repeated whenever documents change. Everything from step 5 onward happens live, for every question.</p>
        <div class="real"><b>In practice:</b> vector databases like Pinecone, Weaviate, Qdrant, Chroma or pgvector in Postgres use approximate nearest-neighbour indexes (e.g. HNSW) to search millions of vectors in milliseconds.</div>
      </div>
    </div></div>`;
  drawMap(document.getElementById('map'), false);
};

R.query = stage => {
  const draw = () => {
    document.getElementById('qPipe').innerHTML = tracePipe(S.qTrace) || '<span class="lede">Type a question.</span>';
    document.getElementById('qHeat').innerHTML = heatRow('Q', S.qVec, true) + (S.results[0] ? heatRow('C' + (S.results[0].c.id + 1), S.results[0].c.vec) : '');
    document.getElementById('qBest').textContent = S.results[0] ? `Q vs its closest chunk C${S.results[0].c.id + 1} — matching dark cells = shared meaning` : '';
    drawMap(document.getElementById('map'), true);
  };
  stage.innerHTML = `<div class="grid fade">
    <div class="stack">
      <div class="card"><h3>Ask a question</h3>${querySelector()}</div>
      <div class="card"><h3>Query → tokens → vector</h3><div class="pipe" id="qPipe"></div><div class="heat" id="qHeat"></div><p class="lede" id="qBest" style="font-size:12.5px;margin-top:8px"></p></div>
    </div>
    <div class="stack">
      <div class="card"><h3>Where your question lands</h3><canvas id="map"></canvas>${legend(true)}</div>
      <div class="card explain"><p>The query must use the <b>same embedding model</b> as the chunks. Mixing models puts them in different spaces and similarity becomes meaningless.</p>
      <p>Try “Can I get my money back?” — none of those words appear in the refund doc, but the synonym step maps them to <b>refund</b>.</p></div>
    </div></div>`;
  draw(); bindQuery(draw);
};

R.retrieve = stage => {
  const draw = () => {
    S.results.forEach((r, i) => r.used = i < S.topK && r.score >= S.minScore);
    const max = Math.max(S.results[0]?.score || 0, 0.01);
    document.getElementById('resList').innerHTML = S.results.slice(0, 8).map((r, i) => `
      <div class="res ${r.used ? '' : 'out'}">
        <div class="top"><span class="rank">#${i + 1} · C${r.c.id + 1} <span style="color:var(--muted)">· ${esc(r.c.doc.title)}</span></span>
        <span><span class="rank">${r.score.toFixed(3)}</span> <span class="badge ${r.used ? 'in' : 'outb'}">${r.used ? 'retrieved' : (i >= S.topK ? 'beyond k' : 'below threshold')}</span></span></div>
        <div class="scorebar"><i style="width:${Math.max(0, r.score / max * 100)}%"></i></div>
        <p>${highlight(r.c.text)}</p>
      </div>`).join('');
    const n = S.results.filter(r => r.used).length;
    document.getElementById('retSummary').innerHTML = n ? `<b>${n}</b> chunk${n > 1 ? 's' : ''} will be sent to the model.` : `<b style="color:var(--warn)">No chunk passed the threshold.</b> A well-built system should now say “I don’t know”.`;
  };
  stage.innerHTML = `<div class="grid fade">
    <div class="card"><h3>Ranked by cosine similarity <span class="hint">Teal = words that matched the query</span></h3><div class="results" id="resList"></div></div>
    <div class="stack">
      <div class="card"><h3>Question</h3>${querySelector()}</div>
      <div class="card"><h3>Retrieval settings</h3>
        <div class="ctrl"><label>Top-k</label><input type="range" id="k" min="1" max="8" value="${S.topK}"><output id="kO">${S.topK}</output></div>
        <div class="ctrl"><label>Min. similarity</label><input type="range" id="th" min="0" max="0.8" step="0.01" value="${S.minScore}"><output id="thO">${S.minScore.toFixed(2)}</output></div>
        <p style="font-size:13.5px" id="retSummary"></p>
      </div>
      <div class="card explain">
        <p><b>Cosine similarity</b> measures the angle between two vectors: 1 means the same direction (same meaning), 0 means unrelated.</p>
        <p><b>Top-k</b> trades recall for noise: too low and you miss the answer, too high and irrelevant text confuses the model and costs tokens. The <b>threshold</b> lets the system admit it found nothing.</p>
        <div class="real"><b>In practice:</b> teams often add hybrid search (vectors + keyword/BM25), metadata filters and a <b>re-ranker</b> model that re-scores the top 20–50 results before picking the final few.</div>
      </div>
    </div></div>`;
  draw();
  bindQuery(draw);
  const k = document.getElementById('k'), th = document.getElementById('th');
  k.oninput = () => { S.topK = +k.value; document.getElementById('kO').textContent = S.topK; draw(); };
  th.oninput = () => { S.minScore = +th.value; document.getElementById('thO').textContent = S.minScore.toFixed(2); draw(); };
};

function buildPrompt(html) {
  const used = S.results.filter(r => r.used);
  const w = (cls, s) => html ? `<span class="${cls}">${esc(s)}</span>` : s;
  const sys = 'SYSTEM:\nYou are a support assistant for Nordwind Pay.\nAnswer ONLY using the context below. Cite sources as [n].\nIf the answer is not in the context, say you don\'t know.\n';
  const ctx = '\nCONTEXT:\n' + (used.length ? used.map((r, i) => `[${i + 1}] (${r.c.doc.title}, C${r.c.id + 1})\n${r.c.text}`).join('\n\n') : '(no relevant context found)') + '\n';
  const q = `\nQUESTION:\n${S.query}\n\nANSWER:`;
  return w('sys', sys) + w('ctx', ctx) + w('q', q);
}

R.augment = stage => {
  const draw = () => {
    const p = buildPrompt(false);
    document.getElementById('prompt').innerHTML = buildPrompt(true);
    document.getElementById('ptok').textContent = `~${estTokens(p)} tokens`;
  };
  stage.innerHTML = `<div class="grid fade">
    <div class="card"><h3>Final prompt sent to the LLM <span class="tokcount" id="ptok"></span></h3><div class="prompt" id="prompt"></div>
      <div class="legend"><span><i class="dot" style="background:var(--accent)"></i>Instructions</span><span><i class="dot" style="background:var(--accent-2)"></i>Retrieved context</span><span><i class="dot" style="background:var(--warn)"></i>User question</span></div>
    </div>
    <div class="stack">
      <div class="card"><h3>Question</h3>${querySelector()}</div>
      <div class="card explain">
        <p>This is the “augmented” in RAG. The model doesn’t search anything itself — it just reads a prompt that we have <b>stuffed with the right facts</b>.</p>
        <p>The instructions do three jobs: restrict the model to the context, require <b>citations</b>, and give it permission to say <b>“I don’t know”</b>. That last one is the main defence against hallucination.</p>
        <div class="callout"><b>Pitfall:</b> context windows are finite and every token costs money and latency. Retrieved text that is irrelevant also makes answers worse (“lost in the middle”).</div>
      </div>
    </div></div>`;
  draw(); bindQuery(draw);
};

function generateAnswer() {
  const used = S.results.filter(r => r.used);
  const q = new Set(S.qTrace.filter(x => x.out).map(x => x.out));
  const cands = [];
  used.forEach((r, ci) => r.c.text.split(/(?<=[.!?])\s+/).forEach(sent => {
    sent = sent.trim();
    if (sent.split(' ').length < 4 || !/^[A-Z0-9]/.test(sent) || !/[.!?]$/.test(sent)) return; // skip fragments cut at chunk edges
    const st = tokens(sent); let sc = 0;
    new Set(st).forEach(t => { if (q.has(t)) sc += S.index.idf(t); });
    if (sc > 0) cands.push({ sent: sent.trim(), sc: sc / Math.sqrt(st.length), cite: ci + 1 });
  }));
  const seen = new Set();
  const best = cands.sort((a, b) => b.sc - a.sc).filter(c => !seen.has(c.sent) && seen.add(c.sent)).slice(0, 2);
  if (!best.length) return { parts: [{ text: "I don't know — the knowledge base doesn't contain information about that." }], grounded: false };
  return { parts: best.map(b => ({ text: b.sent, cite: b.cite })), grounded: true };
}

let typingTimer;
R.generate = stage => {
  const run = () => {
    clearTimeout(typingTimer);
    const ans = generateAnswer(), out = document.getElementById('ans');
    const used = S.results.filter(r => r.used);
    const full = ans.parts.map(p => esc(p.text) + (p.cite ? `<sup>[${p.cite}]</sup>` : '')).join(' ');
    const plain = ans.parts.map(p => p.text + (p.cite ? '\u0000' + p.cite : '')).join(' ');
    let i = 0;
    const tick = () => {
      i += 3;
      if (i >= plain.length) { out.innerHTML = full; return; }
      out.innerHTML = esc(plain.slice(0, i)).replace(/\u0000(\d)/g, '<sup>[$1]</sup>') + '<span class="caret"></span>';
      typingTimer = setTimeout(tick, 18);
    };
    matchMedia('(prefers-reduced-motion: reduce)').matches ? out.innerHTML = full : tick();
    document.getElementById('srcs').innerHTML = ans.grounded ? used.map((r, j) => `<div>[${j + 1}] ${esc(r.c.doc.title)} · chunk C${r.c.id + 1} · similarity ${r.score.toFixed(2)}</div>`).join('') : '<div>No sources — the system declined instead of guessing.</div>';
  };
  stage.innerHTML = `<div class="stack fade">
    <div class="grid">
      <div class="card"><h3>Question</h3>${querySelector()}</div>
      <div class="card explain"><p>This simulator fakes the LLM by picking the retrieved sentences that best match your question, so every word is traceable. A real model would rewrite them fluently — but the facts would come from the same chunks.</p></div>
    </div>
    <div class="compare">
      <div class="col"><h4>❌ LLM without RAG</h4><p>“Instant payouts typically cost around 1–2% of the amount, and refunds usually take 3–5 days…”</p>
        <p style="margin-top:10px;font-size:12.5px;color:var(--muted)">Sounds confident, but it's a generic guess. The model has never seen Nordwind Pay's real prices or policies, so it makes them up.</p></div>
      <div class="col" style="border:1px solid var(--accent)"><h4 style="color:var(--accent)">✅ LLM with RAG</h4><div class="answer" id="ans"></div><div class="sources" id="srcs"></div></div>
    </div>
    <div class="card explain">
      <h3>Checking the answer</h3>
      <p><b>Faithfulness</b> — is every claim backed by a retrieved chunk? <b>Answer relevance</b> — does it address the question? <b>Context precision and recall</b> — did retrieval fetch the right chunks and miss none?</p>
      <p>Try “What is the CEO's name?”: nothing relevant is retrieved, so the honest answer is “I don't know”. That is RAG working correctly.</p>
      <div class="real"><b>In practice:</b> tools like Ragas, LangSmith, TruLens or Promptfoo score these metrics on a test set of questions, so you can change chunk size, top-k or the embedding model and measure whether answers got better.</div>
    </div>
  </div>`;
  run();
  let deb; bindQuery(() => { clearTimeout(deb); deb = setTimeout(run, 250); });
};

/* =====================================================================
   NAVIGATION
   ===================================================================== */
const stage = document.getElementById('stage');
function go(i) {
  clearTimeout(typingTimer);
  S.step = Math.max(0, Math.min(STEPS.length - 1, i)); S.visited.add(S.step);
  const st = STEPS[S.step];
  document.getElementById('eyebrow').textContent = `Step ${S.step + 1} of ${STEPS.length} · ${st.phase}`;
  document.getElementById('title').textContent = st.t;
  document.getElementById('lede').textContent = st.lede;
  document.getElementById('prevBtn').disabled = S.step === 0;
  document.getElementById('nextBtn').textContent = S.step === STEPS.length - 1 ? 'Start over ↺' : 'Next →';
  R[st.key](stage);
  renderSidebar();
}
document.getElementById('prevBtn').onclick = () => go(S.step - 1);
document.getElementById('nextBtn').onclick = () => go(S.step === STEPS.length - 1 ? 0 : S.step + 1);
addEventListener('keydown', e => {
  if (e.target.matches('input, textarea')) return;
  if (e.key === 'ArrowRight') go(S.step + 1);
  if (e.key === 'ArrowLeft') go(S.step - 1);
});

let autoTimer = null;
document.getElementById('autoBtn').onclick = function () {
  if (autoTimer) { clearInterval(autoTimer); autoTimer = null; this.textContent = '▶ Run full pipeline'; return; }
  this.textContent = '⏸ Pause'; go(0);
  autoTimer = setInterval(() => {
    if (S.step >= STEPS.length - 1) { clearInterval(autoTimer); autoTimer = null; this.textContent = '▶ Run full pipeline'; return; }
    go(S.step + 1);
    sidebar.querySelector('.step-btn.active .num')?.classList.add('pulse');
  }, 4200);
};

/* theme */
const root = document.documentElement;
try { const t = localStorage.getItem('rag-theme'); if (t) root.dataset.theme = t; } catch (e) {}
document.getElementById('themeBtn').onclick = () => {
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('rag-theme', root.dataset.theme); } catch (e) {}
  if (document.getElementById('map')) drawMap(document.getElementById('map'), S.step >= 4);
};
addEventListener('resize', () => { const m = document.getElementById('map'); if (m) drawMap(m, S.step >= 4); });

recompute();
go(0);
</script>
</body>
